<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Undoer // Reality Fractal</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #b0b0b0;
            --highlight-color: #d4a373; /* Subtle Bronze/Gold */
            --void-color: #000000;
            --font-main: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Prevents scrollbars during animations */
            transition: background-color 3s ease;
        }

        /* Container for the central experience */
        .container {
            width: 80%;
            max-width: 800px;
            position: relative;
            z-index: 10;
            transition: opacity 2s ease;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            opacity: 0.6;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        /* Input Area */
        textarea {
            width: 100%;
            height: 250px;
            background: rgba(20, 20, 20, 0.5);
            border: 1px solid #333;
            color: #eee;
            padding: 20px;
            font-family: var(--font-main);
            font-size: 1.1rem;
            resize: none;
            outline: none;
            border-radius: 4px;
            box-sizing: border-box; /* Critical for layout */
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: #666;
            background: rgba(30, 30, 30, 0.8);
        }

        /* The Output Area */
        #output-stage {
            width: 100%;
            height: 250px;
            font-size: 1.2rem;
            line-height: 1.8;
            white-space: pre-wrap; /* Preserves newlines/spaces */
            overflow-y: auto; /* Allow scrolling if text is long */
            display: none; 
            color: #eee;
            padding: 20px;
            box-sizing: border-box;
            border: 1px solid transparent; /* Keeps layout stable */
        }

        /* Buttons */
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        button {
            background: transparent;
            border: 1px solid #444;
            color: #888;
            padding: 12px 30px;
            cursor: pointer;
            font-family: var(--font-main);
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        button:hover {
            color: #fff;
            border-color: #fff;
            background: rgba(255,255,255,0.05);
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }

        /* The Illusion Highlighting */
        .illusion {
            color: var(--highlight-color);
            border-bottom: 1px dashed var(--highlight-color);
            cursor: pointer;
            position: relative;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .illusion:hover {
            color: #fff;
            background: rgba(212, 163, 115, 0.2);
            text-shadow: 0 0 8px var(--highlight-color);
        }

        /* Animation States */
        .dissolved {
            opacity: 0;
            filter: blur(8px);
            transform: scale(1.1);
            pointer-events: none;
            transition: all 0.8s ease;
        }

        .container-hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Floating Inquiry Text */
        .floater {
            position: absolute;
            font-size: 0.9rem;
            color: #fff;
            background-color: rgba(0,0,0,0.9);
            border: 1px solid #333;
            padding: 8px 12px;
            border-radius: 4px;
            pointer-events: none;
            opacity: 0;
            animation: floatUp 6s forwards; /* Slowed down to 6s */
            width: auto;
            min-width: 200px;
            max-width: 400px;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translate(-50%, 0); }
            10% { opacity: 1; transform: translate(-50%, -20px); }
            80% { opacity: 1; transform: translate(-50%, -30px); }
            100% { opacity: 0; transform: translate(-50%, -60px); }
        }

        /* The Void Overlay */
        #void-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        #void-message {
            color: #333;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 3s ease;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        #return-btn {
            border-color: #333;
            color: #333;
            opacity: 0;
            transition: opacity 2s ease;
            pointer-events: auto; /* Allows clicking */
        }
        
        #return-btn:hover {
            color: #666;
            border-color: #666;
        }

    </style>
</head>
<body>

    <div class="container" id="main-container">
        <header>
            Language Undoer // Reality Fractal
        </header>

        <!-- Input View -->
        <div id="input-view">
            <textarea id="user-input" placeholder="Paste your narrative here. Observe the structure of your own suffering."></textarea>
            <div class="controls">
                <button onclick="analyzeText()">Locate Bifurcations</button>
            </div>
