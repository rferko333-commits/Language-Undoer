<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Undoer // Reality Fractal</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #a0a0a0;
            --highlight-color: #d4a373; /* Subtle Bronze/Gold for ego knots */
            --void-color: #000000;
            --font-main: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background-color 3s ease, opacity 2s ease;
        }

        /* Container for the central experience */
        .container {
            width: 90%;
            max-width: 800px;
            position: relative;
            z-index: 10;
            transition: opacity 2s ease;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            opacity: 0.6;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        /* Input Area */
        textarea {
            width: 100%;
            height: 200px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #333;
            color: #eee;
            padding: 20px;
            font-family: var(--font-main);
            font-size: 1.1rem;
            resize: none;
            outline: none;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: #555;
            background: rgba(255, 255, 255, 0.05);
        }

        /* The Output Area (Where text goes to die) */
        #output-stage {
            min-height: 200px;
            font-size: 1.3rem; /* Slightly larger for readability */
            line-height: 1.8;
            white-space: pre-wrap;
            display: none; /* Hidden initially */
            color: #eee;
            padding: 20px;
        }

        /* Buttons */
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        button {
            background: transparent;
            border: 1px solid #444;
            color: #888;
            padding: 10px 25px;
            cursor: pointer;
            font-family: var(--font-main);
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        button:hover {
            color: #eee;
            border-color: #eee;
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        /* The Illusion Highlighting */
        .illusion {
            color: var(--highlight-color);
            border-bottom: 1px dashed var(--highlight-color);
            cursor: pointer;
            position: relative;
            transition: all 0.5s ease;
            display: inline-block;
        }

        .illusion:hover {
            color: #fff;
            text-shadow: 0 0 8px var(--highlight-color);
        }

        /* Classes for animations */
        .dissolved {
            opacity: 0;
            filter: blur(10px);
            pointer-events: none;
            transform: scale(1.5);
            transition: all 1s ease;
        }

        .container-hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Floating Inquiry Text */
        .floater {
            position: absolute;
            font-size: 0.85rem;
            color: #888; /* Slightly brighter */
            pointer-events: none;
            opacity: 0;
            animation: floatUp 5s forwards; /* Increased to 5s */
            width: 350px;
            text-align: center;
            z-index: 100;
            background: rgba(0,0,0,0.8); /* Slight bg to make it readable over text */
            padding: 5px;
            border-radius: 4px;
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translate(-50%, 0); }
            10% { opacity: 1; transform: translate(-50%, -20px); }
            70% { opacity: 1; transform: translate(-50%, -30px); } /* Stay visible longer */
            100% { opacity: 0; transform: translate(-50%, -60px); }
        }

        /* The Void State Elements */
        #void-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #333;
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 3s ease;
            text-align: center;
        }

        #return-btn {
            margin-top: 20px;
            border-color: #222;
            color: #222;
            opacity: 0;
            transition: opacity 3s ease;
        }
        
        #return-btn:hover {
            color: #555;
            border-color: #555;
        }

    </style>
</head>
<body>

    <div class="container" id="main-container">
        <header>
            Language Undoer // Reality Fractal
        </header>

        <!-- Input View -->
        <div id="input-view">
            <textarea id="user-input" placeholder="Type a stressful thought, a belief about yourself, or a recurring internal narrative here..."></textarea>
            <div class="controls">
                <button onclick="analyzeText()">Locate Bifurcations</button>
            </div>
        </div>

        <!-- Analysis View -->
        <div id="output-view" style="display:none;">
            <div id="output-stage"></div>
            <div class="controls">
                <button onclick="resetApp()">Reset</button>
                <button onclick="enterVoid()">Enter Silence</button>
            </div>
        </div>
    </div>

    <!-- The Void Overlay Elements -->
    <div id="void-message">
        <div>Observe what remains without the story.</div>
        <button id="return-btn" onclick="exitVoid()">Return to Form</button>
    </div>

    <script>
        // --- The Pattern Library ---
        // Regex rules to catch the machinery of the ego.
        const patterns = [
            {
                // The Self (Aggressive matching for I, Me, Mine)
                regex: /\b(I|me|my|mine|myself|I'm|I am|I've|I'll)\b/gi,
                insight: "Who is the 'I' that claims this?"
            },
            {
                // Causality / Storytelling (The Glue)
                regex: /\b(because|so|therefore|means that|implies|caused|reason|since)\b/gi,
                insight: "Causality is a narrative added to the event."
            },
            {
                // To Be Verbs (False Permanence / E-Prime)
                regex: /\b(is|are|was|were|am)\b/gi,
                insight: "'To be' implies a fixed state. Reality is flux."
            },
            {
                // Absolutes (The black and white fallacy)
                regex: /\b(always|never|everyone|no one|everything|nothing|forever|impossible|constantly|every time)\b/gi,
                insight: "Absolutes freeze a fluid reality."
            },
            {
                // Modals/Pressure (The "Should" Trap)
                regex: /\b(should|must|have to|need to|ought to|supposed to)\b/gi,
                insight: "Who is imposing this rule on reality?"
            },
            {
                // Comparison & Judgment
                regex: /\b(better|worse|failure|success|loser|winner|worthless|unworthy|compared|too much|not enough|stupid|smart|ugly|beautiful)\b/gi,
                insight: "Comparison requires two. There is only one."
            },
            {
                // Time Binding (Future/Past fixation)
                regex: /\b(will be|going to|used to|someday|eventually|regret|hope|future|past|yesterday|tomorrow)\b/gi,
                insight: "Time is a memory or a projection. There is only Now."
            },
            {
                // Victimhood / External Cause
                regex: /\b(made me|fault|blame|unfair|they|he|she|them)\b/gi,
                insight: "Separation creates the 'other'."
            }
        ];

        // --- Core Functions ---

        function analyzeText() {
            const input = document.getElementById('user-input').value;
            if (!input.trim()) return;

            // Switch views
            document.getElementById('input-view').style.display = 'none';
            document.getElementById('output-view').style.display = 'block';
            const stage = document.getElementById('output-stage');
            stage.style.display = 'block';

            // Process text
            let processedText = escapeHtml(input);

            // We iterate through patterns and replace matches with interactive spans.
            patterns.forEach(p => {
                processedText = processedText.replace(p.regex, (match) => {
                    return `<span class="illusion" onclick="dissolve(this, '${p.insight}')">${match}</span>`;
                });
            });

            stage.innerHTML = processedText;
        }

        function dissolve(element, insight) {
            // 1. Visual Dissolution of the word
            element.classList.add('dissolved');

            // 2. Spawn the floating inquiry (The ghost of the thought)
            const rect = element.getBoundingClientRect();
            const floater = document.createElement('div');
            floater.className = 'floater';
            floater.innerText = insight;
            
            // Position near the word
            floater.style.left = rect.left + (rect.width / 2) + 'px';
            floater.style.top = rect.top + 'px';
            
            document.body.appendChild(floater);

            // 3. Cleanup DOM after animation
            setTimeout(() => {
                floater.remove();
            }, 5000); // Matches the new CSS animation duration
        }

        function enterVoid() {
            const container = document.getElementById('main-container');
            const voidMsg = document.getElementById('void-message');
            const returnBtn = document.getElementById('return-btn');
            
            // Fade out the interface
            container.classList.add('container-hidden');

            // Wait, then clear background for true void
            setTimeout(() => {
                document.body.style.backgroundColor = '#000'; // Pure void
                
                // Fade in the Void Message
                voidMsg.style.opacity = "1";
                
                // Fade in the return button slightly later
                setTimeout(() => {
                    returnBtn.style.opacity = "1";
                    returnBtn.style.pointerEvents = "auto";
                }, 4000);

            }, 2000);
        }

        function exitVoid() {
            const container = document.getElementById('main-container');
            const voidMsg = document.getElementById('void-message');
            const returnBtn = document.getElementById('return-btn');

            // Hide void elements
            voidMsg.style.opacity = "0";
            returnBtn.style.opacity = "0";
            returnBtn.style.pointerEvents = "none";

            // Restore background
            document.body.style.backgroundColor = '#050505';

            // Bring back container
            setTimeout(() => {
                container.classList.remove('container-hidden');
                resetApp(); // Optional: reset to fresh state upon return
            }, 2000);
        }

        function resetApp() {
            document.getElementById('user-input').value = '';
            document.getElementById('input-view').style.display = 'block';
            document.getElementById('output-view').style.display = 'none';
            document.getElementById('output-stage').innerHTML = '';
        }

        // Helper to prevent HTML injection from user input
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
