<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Undoer // Reality Fractal</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #b0b0b0;
            --highlight-color: #d4a373; /* Bronze/Gold */
            --font-main: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background-color 2s ease;
        }

        .container {
            width: 80%;
            max-width: 800px;
            position: relative;
            z-index: 10;
            transition: opacity 1s ease;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            opacity: 0.6;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        /* Input Area */
        textarea {
            width: 100%;
            height: 250px;
            background: rgba(20, 20, 20, 0.5);
            border: 1px solid #333;
            color: #eee;
            padding: 20px;
            font-family: var(--font-main);
            font-size: 1.1rem;
            resize: none;
            outline: none;
            border-radius: 4px;
            box-sizing: border-box;
            transition: border 0.3s ease;
        }

        textarea:focus {
            border-color: #666;
            background: rgba(30, 30, 30, 0.8);
        }

        /* The Output Area */
        #output-stage {
            width: 100%;
            height: 250px;
            font-size: 1.2rem;
            line-height: 1.8;
            white-space: pre-wrap; /* Preserves formatting */
            overflow-y: auto;
            display: none; 
            color: #eee;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        button {
            background: transparent;
            border: 1px solid #444;
            color: #888;
            padding: 12px 30px;
            cursor: pointer;
            font-family: var(--font-main);
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        button:hover {
            color: #fff;
            border-color: #fff;
            background: rgba(255,255,255,0.05);
        }

        /* Illusion Highlighting */
        .illusion {
            color: var(--highlight-color);
            border-bottom: 1px dashed var(--highlight-color);
            cursor: pointer;
            position: relative;
            display: inline-block;
            transition: all 0.2s ease;
        }

        .illusion:hover {
            color: #fff;
            text-shadow: 0 0 8px var(--highlight-color);
        }

        /* Animations */
        .dissolved {
            opacity: 0;
            filter: blur(8px);
            transform: scale(1.2);
            pointer-events: none;
            transition: all 0.8s ease;
        }

        .container-hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Floating Inquiry */
        .floater {
            position: absolute;
            font-size: 0.9rem;
            color: #fff;
            background-color: rgba(0,0,0,0.9);
            border: 1px solid #333;
            padding: 8px 12px;
            border-radius: 4px;
            pointer-events: none;
            opacity: 0;
            animation: floatUp 5s forwards;
            width: auto;
            min-width: 200px;
            text-align: center;
            z-index: 1000;
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translate(-50%, 0); }
            10% { opacity: 1; transform: translate(-50%, -20px); }
            80% { opacity: 1; transform: translate(-50%, -30px); }
            100% { opacity: 0; transform: translate(-50%, -60px); }
        }

        /* Void Overlay */
        #void-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Allows clicking through initially */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        #void-message {
            color: #333;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 3s ease;
            margin-bottom: 30px;
            text-align: center;
        }

        #return-btn {
            border-color: #333;
            color: #333;
            opacity: 0;
            transition: opacity 2s ease;
            cursor: pointer;
            pointer-events: none; /* disabled until visible */
        }
        
        #return-btn:hover {
            color: #666;
            border-color: #666;
        }
        
        /* When void is active, allow clicking the return button */
        #void-overlay.active {
            pointer-events: auto;
        }

    </style>
</head>
<body>

    <div class="container" id="main-container">
        <header>
            Language Undoer // Reality Fractal
        </header>

        <!-- Input View -->
        <div id="input-view">
            <textarea id="user-input" placeholder="Paste your internal narrative here."></textarea>
            <div class="controls">
                <button onclick="runAnalysis()">Locate Bifurcations</button>
            </div>
        </div>

        <!-- Analysis View -->
        <div id="output-view" style="display:none;">
            <div id="output-stage"></div>
            <div class="controls">
                <button onclick="resetApp()">Reset</button>
                <button onclick="enterVoid()">Enter Silence</button>
            </div>
        </div>
    </div>

    <!-- The Void Overlay -->
    <div id="void-overlay">
        <div id="void-message">Observe what remains without the story.</div>
        <button id="return-btn" onclick="exitVoid()">Return to Form</button>
    </div>

    <script>
        // --- Data: Patterns mapped to Insights ---
        // Note: All keys are lowercase for matching logic
        const ruleSet = [
            {
                words: ["i am", "i'm", "i've", "i'll", "myself", "my own", "kind of person"],
                insight: "Who observes this definition?"
            },
            {
                words: ["i", "me", "my", "mine"],
                insight: "Where is this 'I' located exactly?"
            },
            {
                words: ["because", "so", "therefore", "means that", "implies", "caused", "reason", "since"],
                insight: "Causality is a story added to the event."
            },
            {
                words: ["is", "are", "was", "were", "be", "been"],
                insight: "'To be' implies fixed state. Reality is flux."
            },
            {
                words: ["always", "never", "everyone", "no one", "everything", "nothing", "forever", "impossible", "constantly", "every time"],
                insight: "Absolutes freeze a fluid reality."
            },
            {
                words: ["should", "must", "have to", "need to", "ought to", "supposed to"],
                insight: "Who is imposing this rule?"
            },
            {
                words: ["better", "worse", "failure", "success", "loser", "winner", "worthless", "unworthy", "compared", "too much", "not enough", "stupid", "smart", "ugly", "beautiful", "perfect"],
                insight: "Comparison requires two. There is only one."
            },
            {
                words: ["will", "going to", "used to", "someday", "eventually", "regret", "hope", "future", "past", "yesterday", "tomorrow"],
                insight: "Time is memory or projection. Only Now exists."
            },
            {
                words: ["made me", "fault", "blame", "unfair", "they", "he", "she", "them"],
                insight: "Separation creates the 'other'."
            }
        ];

        // --- Core Engine (Robust Single-Pass) ---

        function runAnalysis() {
            const inputField = document.getElementById('user-input');
            const rawText = inputField.value;
            
            if (!rawText.trim()) return;

            // 1. Switch UI
            document.getElementById('input-view').style.display = 'none';
            document.getElementById('output-view').style.display = 'block';
            const stage = document.getElementById('output-stage');
            stage.style.display = 'block';

            // 2. Prepare the regex
            // We flatten all 'words' arrays into one giant list
            let allPatterns = [];
            ruleSet.forEach(rule => {
                allPatterns = allPatterns.concat(rule.words);
            });

            // CRITICAL: Sort by length (longest first) to prevent partial matching errors
            // e.g. Match "I am" before matching "I"
            allPatterns.sort((a, b) => b.length - a.length);

            // Escape special regex characters in the words (just in case)
            const escapedPatterns = allPatterns.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
            
            // Create the Master Regex
            // \b ensures we match whole words only
            const masterRegex = new RegExp(`\\b(${escapedPatterns.join('|')})\\b`, 'gi');

            // 3. Process Text (Single Pass)
            // We use a safe replace loop that builds the string immediately
            const processedHTML = escapeHtml(rawText).replace(masterRegex, (match) => {
                // Find the insight for this match
                const lowerMatch = match.toLowerCase();
                let foundInsight = "Dissolve the illusion."; // Fallback

                // Look up which rule this word belongs to
                for (let rule of ruleSet) {
                    // Check if the lowercase match matches any word in this rule
                    // We check exact match because regex handled the boundaries
                    if (rule.words.includes(lowerMatch)) {
                        foundInsight = rule.insight;
                        break;
                    }
                }

                // Return the HTML span
                // We assume 'match' is safe because it came from text we just escaped, 
                // but strictly speaking, the match itself is just text.
                return `<span class="illusion" onclick="dissolve(this, '${escapeQuotes(foundInsight)}')">${match}</span>`;
            });

            stage.innerHTML = processedHTML;
        }

        function dissolve(element, insight) {
            if (element.classList.contains('dissolved')) return;

            // 1. Visual Dissolution
            element.classList.add('dissolved');

            // 2. Spawn Floating Inquiry
            const rect = element.getBoundingClientRect();
            const floater = document.createElement('div');
            floater.className = 'floater';
            floater.innerText = insight;
            
            // Positioning logic
            const scrollLeft = window.pageXOffset || document.documentElement.scrollLeft;
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            floater.style.left = (rect.left + scrollLeft + (rect.width / 2)) + 'px';
            floater.style.top = (rect.top + scrollTop) + 'px';
            
            document.body.appendChild(floater);

            // 3. Cleanup
            setTimeout(() => {
                floater.remove();
            }, 5000); 
        }

        function enterVoid() {
