<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Language Undoer // Reality Fractal</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #b0b0b0;
            --highlight-color: #d4a373; /* Bronze/Gold */
            --font-main: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            transition: background-color 2s ease;
        }

        .container {
            width: 90%;
            max-width: 800px;
            position: relative;
            z-index: 10;
            margin-top: 5vh;
            margin-bottom: 5vh;
            transition: opacity 1s ease;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            opacity: 0.6;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        /* Input Area */
        textarea {
            width: 100%;
            height: 250px;
            background: rgba(20, 20, 20, 0.5);
            border: 1px solid #333;
            color: #eee;
            padding: 20px;
            font-family: var(--font-main);
            font-size: 1.1rem;
            resize: none;
            outline: none;
            border-radius: 4px;
            box-sizing: border-box;
            transition: border 0.3s ease;
        }

        textarea:focus {
            border-color: #666;
            background: rgba(30, 30, 30, 0.8);
        }

        /* The Output Area */
        #output-stage {
            width: 100%;
            min-height: 300px;
            font-size: 1.2rem;
            line-height: 2.2;
            white-space: pre-wrap; 
            color: #eee;
            padding: 10px;
            box-sizing: border-box;
            border-bottom: 1px solid #222;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            background: transparent;
            border: 1px solid #444;
            color: #888;
            padding: 10px 18px;
            cursor: pointer;
            font-family: var(--font-main);
            text-transform: uppercase;
            font-size: 0.75rem;
            transition: all 0.3s ease;
        }

        button:hover {
            color: #fff;
            border-color: #fff;
            background: rgba(255,255,255,0.05);
        }

        /* Toggle Switch */
        .toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 0.75rem;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid #333;
            padding: 8px 12px;
            border-radius: 4px;
        }

        .toggle-box {
            width: 26px;
            height: 14px;
            border: 1px solid #555;
            position: relative;
            transition: all 0.3s ease;
        }

        .toggle-indicator {
            width: 10px;
            height: 10px;
            background-color: #555;
            position: absolute;
            top: 1px;
            left: 1px;
            transition: all 0.3s ease;
        }

        .toggle-active .toggle-box { border-color: var(--highlight-color); }
        .toggle-active .toggle-indicator {
            background-color: var(--highlight-color);
            transform: translateX(12px);
        }
        .toggle-active { color: #fff; border-color: #666; }

        /* Illusion Highlighting */
        .illusion {
            color: var(--highlight-color);
            border-bottom: 1px dashed var(--highlight-color);
            cursor: pointer;
            position: relative;
            display: inline-block;
            transition: all 0.2s ease;
        }

        .illusion:hover {
            color: #fff;
            text-shadow: 0 0 8px var(--highlight-color);
        }

        /* Animation: The Dissolve Effect */
        .dissolved {
            opacity: 0;
            transition: opacity 0.5s ease;
            cursor: default;
        }

        .container-hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Floating Inquiry Text */
        .floater {
            position: absolute; 
            font-size: 0.85rem;
            color: #fff;
            background-color: rgba(10, 10, 10, 0.95);
            border: 1px solid #555;
            padding: 10px 14px;
            border-radius: 6px;
            pointer-events: none;
            opacity: 0;
            animation: popIn 0.3s forwards, fadeOut 0.5s forwards 3s;
            width: max-content;
            max-width: 250px; 
            text-align: center;
            z-index: 9999;
            box-shadow: 0 5px 20px rgba(0,0,0,1);
        }

        @keyframes popIn {
            0% { opacity: 0; transform: translateY(5px); }
            100% { opacity: 1; transform: translateY(-5px); }
        }
        
        @keyframes fadeOut {
            to { opacity: 0; }
        }

        /* Dissolution History Log - Cards */
        #history-section {
            margin-top: 40px;
            width: 100%;
            display: none;
            border-top: 1px solid #222;
            padding-top: 20px;
            padding-bottom: 50px;
        }

        .log-title {
            font-size: 0.8rem;
            color: #555;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-align: center;
        }

        .log-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .log-entry {
            font-size: 0.8rem;
            color: #888;
            background: rgba(255,255,255,0.03);
            border: 1px solid #222;
            padding: 12px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }

        .log-word {
            color: var(--highlight-color);
            font-weight: bold;
            text-decoration: line-through;
            font-size: 0.9rem;
        }
        
        .log-count {
            background: #333;
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
        }

        .log-insight {
            font-size: 0.75rem;
            color: #666;
            font-style: italic;
            border-top: 1px solid #1a1a1a;
            padding-top: 5px;
            margin-top: 5px;
        }

        /* Void Overlay */
        #void-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            background-color: transparent;
            transition: background-color 2s ease;
        }
        
        #void-overlay.active {
            background-color: #000;
            pointer-events: auto;
        }

        #void-message {
            color: #333;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 3s ease;
            margin-bottom: 30px;
            text-align: center;
        }

        #return-btn {
            border-color: #333;
            color: #333;
            opacity: 0;
            transition: opacity 2s ease;
            cursor: pointer;
        }
        
        #return-btn:hover { color: #666; border-color: #666; }

    </style>
</head>
<body>

    <div class="container" id="main-container">
        <header>
            Language Undoer // Reality Fractal
        </header>

        <!-- Input View -->
        <div id="input-view">
            <textarea id="user-input" placeholder="Paste your narrative here."></textarea>
            <div class="controls">
                <button onclick="analyzeText()">Locate Bifurcations</button>
            </div>
        </div>

        <!-- Analysis View -->
        <div id="output-view" style="display:none;">
            <div id="output-stage"></div>
            
            <div class="controls">
                <div class="toggle-wrapper toggle-active" id="insight-toggle" onclick="toggleInsights()">
                    <div class="toggle-box"><div class="toggle-indicator"></div></div>
                    <span>Insights</span>
                </div>

                <button onclick="toggleLog()">History</button>
                <button onclick="resetApp()">Reset</button>
                <button onclick="enterVoid()">Silence</button>
            </div>

            <!-- The Log -->
            <div id="history-section">
                <div class="log-title">Dissolution Record</div>
                <div id="history-content" class="log-list"></div>
            </div>
        </div>
    </div>

    <!-- The Void Overlay -->
    <div id="void-overlay">
        <div id="void-message">Observe what remains without the story.</div>
        <button id="return-btn" onclick="exitVoid()">Return to Form</button>
    </div>
