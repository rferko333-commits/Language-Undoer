<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Undoer // Reality Fractal</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #b0b0b0;
            --highlight-color: #d4a373; /* Bronze/Gold */
            --font-main: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background-color 2s ease;
        }

        .container {
            width: 80%;
            max-width: 800px;
            position: relative;
            z-index: 10;
            transition: opacity 1s ease;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            opacity: 0.6;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        /* Input Area */
        textarea {
            width: 100%;
            height: 250px;
            background: rgba(20, 20, 20, 0.5);
            border: 1px solid #333;
            color: #eee;
            padding: 20px;
            font-family: var(--font-main);
            font-size: 1.1rem;
            resize: none;
            outline: none;
            border-radius: 4px;
            box-sizing: border-box;
            transition: border 0.3s ease;
        }

        textarea:focus {
            border-color: #666;
            background: rgba(30, 30, 30, 0.8);
        }

        /* The Output Area */
        #output-stage {
            width: 100%;
            height: 250px;
            font-size: 1.2rem;
            line-height: 1.8;
            white-space: pre-wrap; 
            overflow-y: auto;
            display: none; 
            color: #eee;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
        }

        button {
            background: transparent;
            border: 1px solid #444;
            color: #888;
            padding: 12px 30px;
            cursor: pointer;
            font-family: var(--font-main);
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        button:hover {
            color: #fff;
            border-color: #fff;
            background: rgba(255,255,255,0.05);
        }

        /* Toggle Switch */
        .toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #666;
            font-size: 0.8rem;
            text-transform: uppercase;
            cursor: pointer;
        }

        .toggle-box {
            width: 40px;
            height: 20px;
            border: 1px solid #444;
            position: relative;
            transition: all 0.3s ease;
        }

        .toggle-indicator {
            width: 16px;
            height: 16px;
            background-color: #444;
            position: absolute;
            top: 1px;
            left: 1px;
            transition: all 0.3s ease;
        }

        /* Toggle Active State */
        .toggle-active .toggle-box {
            border-color: var(--highlight-color);
        }
        .toggle-active .toggle-indicator {
            background-color: var(--highlight-color);
            transform: translateX(20px);
        }
        .toggle-active {
            color: #aaa;
        }

        /* Illusion Highlighting */
        .illusion {
            color: var(--highlight-color);
            border-bottom: 1px dashed var(--highlight-color);
            cursor: pointer;
            position: relative;
            display: inline-block;
            transition: all 0.2s ease;
        }

        .illusion:hover {
            color: #fff;
            text-shadow: 0 0 8px var(--highlight-color);
        }

        /* Animation: The Dissolve Effect */
        .dissolved {
            opacity: 0;
            filter: blur(8px);
            transform: scale(1.5);
            pointer-events: none;
            transition: all 1s ease;
        }

        .container-hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Floating Inquiry Text */
        .floater {
            position: absolute;
            font-size: 0.9rem;
            color: #fff;
            background-color: rgba(0,0,0,0.9);
            border: 1px solid #333;
            padding: 8px 12px;
            border-radius: 4px;
            pointer-events: none;
            opacity: 0;
            animation: floatUp 6s forwards;
            width: auto;
            min-width: 250px;
            text-align: center;
            z-index: 1000;
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translate(-50%, 0); }
            10% { opacity: 1; transform: translate(-50%, -20px); }
            70% { opacity: 1; transform: translate(-50%, -40px); }
            100% { opacity: 0; transform: translate(-50%, -60px); }
        }

        /* Void Overlay */
        #void-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            background-color: transparent;
            transition: background-color 2s ease;
        }
        
        #void-overlay.active {
            background-color: #000;
            pointer-events: auto;
        }

        #void-message {
            color: #333;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 3s ease;
            margin-bottom: 30px;
            text-align: center;
        }

        #return-btn {
            border-color: #333;
            color: #333;
            opacity: 0;
            transition: opacity 2s ease;
            cursor: pointer;
        }
        
        #return-btn:hover {
            color: #666;
            border-color: #666;
        }

    </style>
</head>
<body>

    <div class="container" id="main-container">
        <header>
            Language Undoer // Reality Fractal
        </header>

        <!-- Input View -->
        <div id="input-view">
            <textarea id="user-input" placeholder="Type your narrative here..."></textarea>
            <div class="controls">
                <button onclick="analyzeText()">Locate Bifurcations</button>
            </div>
        </div>

        <!-- Analysis View -->
        <div id="output-view" style="display:none;">
            <div id="output-stage"></div>
            
            <div class="controls">
                <!-- New Toggle Switch -->
                <div class="toggle-wrapper toggle-active" id="insight-toggle" onclick="toggleInsights()">
                    <div class="toggle-box"><div class="toggle-indicator"></div></div>
                    <span>Insights</span>
                </div>

                <button onclick="resetApp()">Reset</button>
                <button onclick="enterVoid()">Enter Silence</button>
            </div>
        </div>
    </div>

    <!-- The Void Overlay -->
    <div id="void-overlay">
        <div id="void-message">Observe what remains without the story.</div>
        <button id="return-btn" onclick="exitVoid()">Return to Form</button>
    </div>

    <script>
        // --- State ---
        let showInsights = true; // Default: Pop-ups enabled

        // --- Configuration ---
        // Patterns are matched sequentially. 
        // IMPORTANT: Multi-word phrases must come BEFORE single words to match correctly.
        const patterns = [
            // 1. Identity Phrases
            { regex: /\b(I am|I'm|I've|I'll|my own|myself|kind of person)\b/gi, insight: "Who observes this definition?" },
            
            // 2. Craving & Clinging (New Category)
            { regex: /\b(want|wants|wanted|need|needs|needed|crave|craving|desire|desires|wish|wishing|hope|hopes|cling|clinging|grasp|grasping|attach|attached|attachment)\b/gi, insight: "To want is to affirm lack. Reality is complete." },

            // 3. Aversion & Rejection (New Category)
            { regex: /\b(hate|hates|hated|dislike|dislikes|reject|rejecting|avoid|avoiding|fear|fears|loathe|detest|resist|resisting|dread|dreading)\b/gi, insight: "Resistance solidifies the suffering." },

            // 4. Causality
            { regex: /\b(because|so that|therefore|means that|implies|caused|reason|since)\b/gi, insight: "Causality is a story added to the event." },
            
            // 5. To Be Verbs
            { regex: /\b(is|are|was|were|be|been)\b/gi, insight: "'To be' creates false permanence. Reality is flux." },

            // 6. Identity Words (Single)
            { regex: /\b(I|me|my|mine)\b/gi, insight: "Where is this 'I' located exactly?" },

            // 7. Absolutes
            { regex: /\b(always|never|everyone|no one|everything|nothing|forever|impossible|constantly|every time)\b/gi, insight: "Absolutes freeze a fluid reality." },

            // 8. Modals
            { regex: /\b(should|must|have to|need to|ought to|supposed to)\b/gi, insight: "Who is imposing this rule?" },

            // 9. Comparison
            { regex: /\b(better|worse|failure|success|loser|winner|worthless|unworthy|compared|too much|not enough|stupid|smart|ugly|beautiful|perfect)\b/gi, insight: "Comparison requires two. There is only one." },

            // 10. Time
            { regex: /\b(will|going to|used to|someday|eventually|regret|hope|future|past|yesterday|tomorrow)\b/gi, insight: "Time is memory or projection. Only Now exists." },

            // 11. External Blame
            { regex: /\b(made me|fault|blame|unfair|they|he|she|them)\b/gi, insight: "Separation creates the 'other' to blame." }
        ];

        // --- Core Functions ---

        function toggleInsights() {
            showInsights = !showInsights;
            const toggleEl = document.getElementById('insight-toggle');
            if (showInsights) {
                toggleEl.classList.add('toggle-active');
            } else {
                toggleEl.classList.remove('toggle-active');
            }
        }

        function analyzeText() {
            const inputField = document.getElementById('user-input');
            const rawText = inputField.value;
            
            if (!rawText.trim()) return;

            // Switch UI
            document.getElementById('input-view').style.display = 'none';
            document.getElementById('output-view').style.display = 'block';
            const stage = document.getElementById('output-stage');
            stage.style.display = 'block';

            // Safe Processing
            let workingText = escapeHtml(rawText);
            let replacements = []; 

            // Step A: Find matches, replace with token
            patterns.forEach((p) => {
                workingText = workingText.replace(p.regex, (match) => {
                    const placeholder = `___BIFURCATION_${replacements.length}___`;
                    replacements.push({
                        id: placeholder,
                        html: `<span class="illusion" onclick="dissolve(this, '${escapeQuotes(p.insight)}')">${match}</span>`
                    });
                    return placeholder;
                });
            });

            // Step B: Swap tokens with HTML
            replacements.forEach(rep => {
                workingText = workingText.replace(rep.id, rep.html);
            });

            stage.innerHTML = workingText;
        }

        function dissolve(element, insight) {
            if (element.classList.contains('dissolved')) return;

            // 1. Visual Dissolution
            element.classList.add('dissolved');

            // 2. Show Insight (Only if enabled)
            if (showInsights) {
                const rect = element.getBoundingClientRect();
                const floater = document.createElement('div');
                floater.className = 'floater';
                floater.innerText = insight;
                
                const scrollLeft = window.pageXOffset || document.documentElement.scrollLeft;
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                floater.style.left = (rect.left + scrollLeft + (rect.width / 2)) + 'px';
                floater.style.top = (rect.top + scrollTop) + 'px';
                
                document.body.appendChild(floater);

                setTimeout(() => {
                    floater.remove();
                }, 6000); 
            }
        }

        function enterVoid() {
            const container = document.getElementById('main-container');
            const voidOverlay = document.getElementById('void-overlay');
            const voidMsg = document.getElementById('void-message');
            const returnBtn = document.getElementById('return-btn');
            
            container.classList.add('container-hidden');

            setTimeout(() => {
                voidOverlay.classList.add('active'); 
                voidMsg.style.opacity = "1";
                setTimeout(() => {
                    returnBtn.style.opacity = "1";
                }, 3000);
            }, 1500);
        }

        function exitVoid() {
            const container = document.getElementById('main-container');
            const voidOverlay = document.getElementById('void-overlay');
            const voidMsg = document.getElementById('void-message');
            const returnBtn = document.getElementById('return-btn');

            voidMsg.style.opacity = "0";
            returnBtn.style.opacity = "0";
            voidOverlay.classList.remove('active');

            setTimeout(() => {
                container.classList.remove('container-hidden');
            }, 2000);
        }

        function resetApp() {
            document.getElementById('user-input').value = '';
            document.getElementById('input-view').style.display = 'block';
            document.getElementById('output-view').style.display = 'none';
            document.getElementById('output-stage').innerHTML = '';
        }

        // --- Helpers ---
        function escapeHtml(text) {
            if (!text) return "";
            // We escape standard chars but leave apostrophes alone to help regex matching
            // (Standard browsers handle ' in text nodes fine without escaping)
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function escapeQuotes(text) {
            return text.replace(/'/g, "\\'");
        }
    </script>
</body>
</html>
